<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Explore the Story: A Magical Journey into Fables</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;700&display=swap">
<style>
:root{--bg:#fff8e8;--card:#fff;--ink:#2b2350;--mut:#6a6291;--pu:#7c5cc4;--pt:#6a45bf;--pl:#e9e1fb;--sl:#def2fc;--yl:#fff1c2;--ok:#1f8a5b;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1733;--card:#2a2350;--ink:#f4efff;--mut:#b9b0e0;--pt:#c9b6f5;--pl:#3b3070;--sl:#1f3b52;--yl:#4a3d12;--ok:#5fd19b;--no:#ff8a7a}}
:root[data-theme=dark]{--bg:#1c1733;--card:#2a2350;--ink:#f4efff;--mut:#b9b0e0;--pt:#c9b6f5;--pl:#3b3070;--sl:#1f3b52;--yl:#4a3d12;--ok:#5fd19b;--no:#ff8a7a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:16px/1.6 Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(var(--sl),var(--bg) 380px) var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1,h2,h3,.logo{font-family:Fredoka,Nunito,sans-serif;line-height:1.15;margin:.35em 0}
h1{font-size:clamp(2.4rem,8vw,4rem);color:var(--pt)}h2{font-size:clamp(1.2rem,3.5vw,1.7rem)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);box-shadow:0 2px 10px #7c5cc433;padding:8px 14px 0}
.logo{font-weight:700;color:var(--pt)}
nav,.tabs{display:flex;gap:6px;padding:6px 0;flex-wrap:nowrap;overflow-x:auto}.tabs{flex-wrap:wrap;overflow:visible;margin:8px 0}
nav button,.tabs button{white-space:nowrap;border:0;border-radius:99px;padding:6px 14px;background:var(--pl);color:var(--ink);font:700 .95rem Nunito,sans-serif;cursor:pointer}
nav button.on,.tabs button.on{background:var(--pu);color:#fff}
.bar{height:5px;background:var(--pl);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#ffc93c;transition:width .4s}
main{max-width:920px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #7c5cc422}
.b{border:0;border-radius:99px;padding:10px 22px;background:#ffc93c;color:#2b2350;font:700 1rem Fredoka,sans-serif;cursor:pointer;box-shadow:0 3px 0 #d9a514;margin:4px 4px 4px 0}
.b.p{background:var(--pu);color:#fff;box-shadow:0 3px 0 #54399a}.b.big{font-size:1.3rem;padding:14px 36px}.b:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pu);outline-offset:2px}
.hero{text-align:center}

.scene::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-50px;height:100px;background:#9ccf9a;border-radius:50%}
.scene span{position:absolute;z-index:1;line-height:1}.lion{font-size:96px;left:30%;bottom:8px}.mouse{font-size:44px;left:60%;bottom:8px}.t1{font-size:74px;left:5%;bottom:10px}.t2{font-size:62px;right:5%;bottom:10px}
.sun{font-size:40px;top:12px;right:22%;animation:tw 2.4s ease-in-out infinite alternate}@keyframes tw{to{transform:scale(1.3) rotate(15deg);opacity:.6}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.chip{background:var(--yl);border-radius:99px;padding:3px 14px;font-weight:700}
.lead{max-width:62ch;margin:.6em auto}.mut{color:var(--mut)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

.opt{display:block;width:100%;text-align:left;border:2px solid var(--pl);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 14px;margin:6px 0;font:inherit;cursor:pointer}
.opt.on{border-color:var(--pu);background:var(--pl);font-weight:700}.opt.good{border-color:var(--ok);background:var(--sl)}.opt.bad{border-color:var(--no)}
.fb{padding:10px 14px;border-radius:14px;margin:10px 0;background:var(--sl)}.ok{color:var(--ok);font-weight:700}.no{color:var(--no);font-weight:700}
mark{background:var(--yl);color:inherit;border-radius:6px;padding:0 5px;font-weight:700}
.O{background:#8fd3f4}.C{background:#ffc93c}.R{background:#c9b6f5}.O,.C,.R{color:#2b2350}
.tp{display:inline-block;border-radius:99px;padding:2px 14px;font-weight:700;font-size:.9rem}.bx{padding:10px 14px;border-radius:14px;margin:8px 0}
.slide{min-height:300px;animation:in .35s}@keyframes in{from{opacity:0;transform:translateX(16px)}}
.flow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.flow>div{flex:1 1 150px;border-radius:18px;padding:12px;text-align:center;color:#2b2350}.flow .ar{flex:0 0 auto;align-self:center;font-size:1.6rem}.em{font-size:2.6rem}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:5px 10px;text-align:left}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.dots i{width:10px;height:10px;border-radius:50%;background:var(--pl)}.dots i.on{background:var(--pu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.panel{border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--card);animation:in .35s}
.art{font-size:clamp(3rem,14vw,5.5rem);text-align:center;padding:24px;background:linear-gradient(#cdeefc,#fff1c2)}.cap{padding:14px 18px;font-size:1.1rem}
.ev{display:flex;align-items:center;gap:10px;background:var(--yl);border-radius:16px;padding:10px 12px;margin:6px 0;cursor:grab}.ev.good{outline:3px solid var(--ok)}.ev.bad{outline:3px solid var(--no)}
.n{background:var(--pu);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;flex:none;font-weight:700}.ev>span:nth-child(2){flex:1}
.ev button{border:0;background:var(--card);color:var(--ink);border-radius:8px;margin-left:4px;padding:4px 9px;cursor:pointer}
.fc{border:0;border-radius:20px;padding:16px;min-height:160px;text-align:center;font:inherit;cursor:pointer;background:var(--pl);color:var(--ink)}.fc.back{background:var(--yl)}.fc .em{display:block}
select{font:inherit;padding:6px;border-radius:10px;border:2px solid var(--pl);background:var(--card);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:90px;font:inherit;border-radius:14px;border:2px solid var(--pl);padding:10px;background:var(--card);color:var(--ink)}
.itm{padding:6px 0;border-bottom:1px dashed var(--pl)}
.ill{border-radius:16px;overflow:hidden;margin:8px 0;background:#cdeefc}.ic{border-radius:14px;overflow:hidden;margin-bottom:8px}.ill svg,.ic svg{display:block;width:100%;height:auto}
.vcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}.vcd{border-radius:16px;overflow:hidden;border:2px solid var(--pl);background:var(--card);text-align:center}.vcd .v{display:flex}.vcd .v b{flex:1;padding:8px 4px;font:700 1.15rem Fredoka,sans-serif;color:#2b2350}.vcd small{display:block;padding:4px 6px 8px;color:var(--mut)}.bt{font:700 2.2rem Fredoka,sans-serif}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

<script>
const $=s=>document.querySelector(s);
const PN=["Home","Find your path","Choose a path","Learn","Final challenge","Reflect"];
const PM=[{n:"Story in Pictures",p:"Visual",t:"See it, understand it!",d:"Explore the story through illustrations, visual explanations, interactive slides, and digital comics.",b:"Explore Story in Pictures",i:"🎨"},
{n:"Story in Sounds",p:"Auditory",t:"Listen to the story, discover the meaning!",d:"Discover the world of fables through audio explanations, storytelling, and spoken English.",b:"Explore Story in Sounds",i:"🎧"},
{n:"Story in Action",p:"Kinesthetic",t:"Touch it, move it, experience it!",d:"Learn by exploring characters, manipulating story cards, arranging events, and interacting with learning materials.",b:"Explore Story in Action",i:"🧩"}];
const S={page:0,ans:[],res:null,pick:null,rec:null,path:null,tab:0,slide:0,panel:0,sec:0,cp:{},ord:{},chk:{},w:{},wc:{},flip:{},f:[],fd:null,fm:"",r:["","",""]};
const QA=[["When learning a new story, what helps you understand it best?","Looking at illustrations and comics.","Listening to someone tell the story.","Handling characters and exploring story objects."],
["When learning about parts of a story, what do you prefer?","Looking at diagrams and color-coded information.","Listening to an explanation of each story part.","Moving characters and arranging story scenes."],
["When learning new English vocabulary, what helps you most?","Seeing pictures and written examples.","Hearing pronunciation and examples.","Using word cards and demonstrating actions."],
["When trying to understand a difficult concept, you prefer to:","Read an infographic or visual explanation.","Listen to an explanation or recording.","Explore objects or try a demonstration."],
["Which learning material would you enjoy most?","Comics, illustrations, and visual diagrams.","Podcasts, audio stories, and recordings.","Movable cards, models, and interactive objects."],
["When reviewing a lesson, what would you choose?","Looking at visual summaries and mind maps.","Listening again to the lesson explanation.","Repeating demonstrations and manipulating learning materials."]];

const VB=[["live","lived","to have your home in a place","/lɪvd/","The lion lived in a beautiful forest.","regular"],["walk","walked","to move on foot","/wɔːkt/","The mouse walked near the lion.","regular"],["catch","caught","to take hold of something","/kɔːt/","The lion caught the mouse.","irregular"],["bite","bit","to cut something with the teeth","/bɪt/","The mouse bit the ropes.","irregular"],["help","helped","to make things easier for someone","/helpt/","The mouse helped the lion.","regular"],["free","freed","to let someone go","/friːd/","The mouse freed the lion.","regular"],["thank","thanked","to say you are grateful","/θæŋkt/","The lion thanked the mouse.","regular"]];

const CH=[["🦁","Lion","Mighty and proud, but he can also show mercy.","Main character. He lets the mouse go, is later trapped in a net, and learns that small friends matter."],["🐭","Mouse","Small, brave, and kind.","Helper. He begs for freedom, keeps his promise, and frees the lion."]];
const SLold=[
`<span class="tp O">Material 1: Definition</span><h3>What is Narrative Text?</h3><div class=em>📖 🦁 🐭</div><p>A <mark>narrative text</mark> tells a story. It usually has <b>characters</b>, <b>events</b>, and a <b>conflict</b> (a problem).</p><p>Example: <i>The Lion and the Mouse</i>.</p>`,
`<span class="tp O">Material 1: Social function</span><h3>Why do we tell stories?</h3><p>The <mark>social function</mark> of narrative text is to <b>entertain</b> readers and often to convey a <b>moral lesson</b>.</p><h3>Characteristics of fables</h3><div class=flow><div class=O><div class=em>🐾</div>They use animal characters.</div><div class=C><div class=em>🗣️</div>Animals have human-like characteristics.</div><div class=R><div class=em>💡</div>They contain a moral lesson.</div></div>`,
`<span class="tp R">Visual summary 1</span><h3>Narrative text at a glance</h3><div class=flow><div class=O><div class=em>📖</div>Tells a story</div><span class=ar>➜</span><div class=C><div class=em>🎉</div>Entertains and teaches a moral</div><span class=ar>➜</span><div class=R><div class=em>🐾</div>Fable: animals who act like people</div></div>`,
`<span class="tp C">Material 2: Generic structure</span><h3>Three parts of a story</h3><div class=flow><div class=O><div class=em>🌲</div><b>Orientation</b><br>Introduces the characters, setting, and beginning of the story.</div><div class=C><div class=em>⚡</div><b>Complication</b><br>Presents the problem or conflict faced by the characters.</div><div class=R><div class=em>🌈</div><b>Resolution</b><br>Shows how the problem is solved.</div></div>`,
`<span class="tp C">Material 2: In our fable</span><h3>Finding the parts in The Lion and the Mouse</h3><div class="bx O"><b>Orientation:</b> A mighty lion lived in a beautiful forest. A little mouse ran across his body while he was sleeping.</div><div class="bx C"><b>Complication:</b> The lion caught the mouse. The mouse was afraid and begged to be let go.</div><div class="bx R"><b>Resolution:</b> The mouse bit the ropes until the lion was free. The lion thanked the mouse.</div>`,
`<span class="tp R">Visual summary 2</span><h3>Story structure map</h3><div class=flow><div class=O><div class=em>🌲</div><b>Orientation</b><br>Who? Where? When?</div><span class=ar>➜</span><div class=C><div class=em>⚡</div><b>Complication</b><br>What is the problem?</div><span class=ar>➜</span><div class=R><div class=em>🌈</div><b>Resolution</b><br>How is it solved?</div></div>`,
`<span class="tp R">Material 3: Language features</span><h3>Simple Past Tense</h3><p>Narrative text tells events that <mark>happened in the past</mark>, so verbs are usually in <b>Simple Past Tense (V2)</b>.</p><div class=tw><table><tr><th>V1</th><th>V2</th><th>Type</th></tr>${VB.map(v=>`<tr><td>${v[0]}</td><td><mark class="${v[5]=="regular"?"C":"R"}">${v[1]}</mark></td><td>${v[5]=="regular"?"adds -d / -ed":"changes form"}</td></tr>`).join("")}</table></div>`,
`<span class="tp R">Material 3: Examples</span><h3>Past tense in the story</h3><p>The lion <mark class=C>lived</mark> in a beautiful forest.</p><p>The mouse <mark class=C>walked</mark> near the lion.</p><p>The lion <mark class=R>caught</mark> the mouse.</p><p>The mouse <mark class=C>helped</mark> the lion.</p><p>The lion <mark class=C>thanked</mark> the mouse.</p><p class=mut>Yellow = regular verb (-d/-ed). Purple = irregular verb.</p>`,
`<span class="tp R">Visual summary 3</span><h3>Simple Past Tense in 3 steps</h3><div class=flow><div class=O><div class=em>🕰️</div>The event happened in the past</div><span class=ar>➜</span><div class=C><div class=em>✍️</div>Use the V2 form of the verb</div><span class=ar>➜</span><div class=R><div class=em>🔀</div>live → lived (regular)<br>catch → caught (irregular)</div></div>`];
const CMold=[["O","🌲🦁🌲","Once upon a time, a <mark>mighty lion</mark> lived in a beautiful forest."],
["O","🦁💤 🐭","One day, a <mark>little mouse</mark> ran across the lion’s body while he was sleeping."],
["C","🦁🐾🐭","The lion woke up and <mark>caught</mark> the mouse with his big paw. The mouse was afraid and begged the lion to let him go."],
["C","🐭🤝🦁","He promised to help the lion someday. The lion laughed but decided to release the little mouse."],
["R","🕸️🦁📣","A few days later, the lion was <mark>caught in a hunter’s net</mark>. He roared loudly for help. The little mouse heard him and quickly came to help."],
["R","🐭🦷🪢🦁","He <mark>bit</mark> the ropes until the lion was free. The lion <mark>thanked</mark> the mouse. He finally realized that even a small friend could be a great help."]];
const K='#3b2a55';
const E=(x,y,a,b,f)=>`<ellipse cx='${x}' cy='${y}' rx='${a}' ry='${b}' fill='${f}' stroke='${K}' stroke-width='3'/>`;
const P=(d,f,w,s)=>`<path d='${d}' fill='${f||'none'}' stroke='${s||K}' stroke-width='${w||3}' stroke-linecap='round' stroke-linejoin='round'/>`;

const BGC=[['#bfe6fa','#fff1c2','#ffd966'],['#a9dcf7','#eaf6ff','#fff3b0'],['#f7b98b','#e7a8d0','#ffe08a']];
function tree(x,y,s,c){return `<g transform='translate(${x} ${y}) scale(${s})'><rect x='-9' y='-70' width='18' height='72' rx='6' fill='#8a5a3b' stroke='${K}' stroke-width='3'/>${E(0,-100,48,52,c)}${E(-30,-70,30,28,c)}${E(30,-70,30,28,c)}</g>`}

function head(e,m){const ey={o:E(-17,-2,5,6,K)+E(17,-2,5,6,K),c:P('M-25 0q8 7 16 0M9 0q8 7 16 0',0,3),h:P('M-25 3q8 -9 16 0M9 3q8 -9 16 0',0,3),w:E(-17,-2,5,6,K)+E(17,-2,5,6,K)+P('M-27 -15l15 6M27 -15l-15 6',0,3)}[e];const mo=m=='r'?P('M-13 27q13 24 26 0z','#a8323e',3):m=='s'?P('M-13 25q13 15 26 0',0,3):P('M-8 27q8 5 16 0',0,3);return E(0,0,62,60,'#d9822b')+E(-44,-44,15,15,'#f3b04a')+E(44,-44,15,15,'#f3b04a')+E(0,6,44,42,'#f6c26b')+E(0,24,22,16,'#fde7b3')+P('M-9 13h18l-9 11z','#7a3b2e',2.5)+mo+ey}
function lionSleep(x,y,s){return `<g transform='translate(${x} ${y}) scale(${s})'>${tail('M110 20q55 -5 60 -50')}${E(165,-52,13,13,'#d9822b')}${E(20,10,112,46,'#f3b04a')}${E(30,32,70,13,'#fde7b3')}${E(-68,50,27,13,'#f3b04a')}${E(-26,54,27,13,'#f3b04a')}<g transform='translate(-88 -2) scale(.85)'>${head('c','n')}</g><text x='-100' y='-80' font-family='Fredoka,sans-serif' font-size='28' font-weight='700' fill='#6a45bf'>Z</text><text x='-72' y='-105' font-family='Fredoka,sans-serif' font-size='20' font-weight='700' fill='#6a45bf'>z</text></g>`}
function lionSit(x,y,s,e,m){return `<g transform='translate(${x} ${y}) scale(${s})'>${tail('M70 112q62 18 72 -34')}${E(142,78,13,13,'#d9822b')}${E(0,105,80,62,'#f3b04a')}${E(0,118,42,40,'#fde7b3')}${E(-34,165,24,14,'#f3b04a')}${E(34,165,24,14,'#f3b04a')}${head(e,m)}</g>`}
function mouse(x,y,s,mo,f){const t='M-22 22q-26 10 -40 -12q-6 -10 -18 -6';return `<g transform='translate(${x} ${y}) scale(${f?-s:s} ${s})'>${P(t,0,8)}${P(t,0,3.5,'#f4a6b8')}${E(0,18,24,19,'#b9aecb')}${E(-8,36,8,5,'#f4a6b8')}${E(10,36,8,5,'#f4a6b8')}${E(14,-2,17,15,'#c9bfda')}${E(4,-17,10,10,'#b9aecb')}<circle cx='4' cy='-17' r='5' fill='#f4a6b8'/><circle cx='21' cy='-4' r='2.6' fill='${K}'/>${E(31,1,3.5,3,'#f4a6b8')}${P('M32 4l13 -3M32 6l13 5',0,1.5)}${mo=='beg'?P('M16 -10l10 4',0,2.5)+E(18,20,7,6,'#c9bfda'):''}${mo=='bite'?`<rect x='29' y='6' width='5' height='7' fill='#fff' stroke='${K}' stroke-width='1.5'/>`:''}</g>`}
